  <meta name="description" content="Personal substance tracker and educational wiki. Log doses, browse harm reduction info, and track patterns over time." />
  <script>
    // ponytail: App.jsx sets data-theme on mount, which is one frame too late, so the sticky
    // landing nav paints white on a dark-mode device. Same key and fallback as App.jsx.
    try {
      document.documentElement.setAttribute('data-theme',
        localStorage.getItem('dose:theme') ||
        (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'));
    } catch (e) {}
  </script>

<script>
    // First-run onboarding. Shows once, right after registration.
    Onboarding.start({
        key: "healstack",
        finishLabel: "Get started",
        slides: [
                { title: "Track what you take",
                  body: "Log supplements and medications with the dose and timing you actually follow, not an idealised version.",
