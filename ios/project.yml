name: Healstack
packages:
  SwiftLint:
    url: https://github.com/realm/SwiftLint
    from: "0.59.1"
options:
  bundleIdPrefix: com.heyitsmejosh
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  SWIFT_VERSION: '6.0'
  MARKETING_VERSION: '2.4.0'
  CURRENT_PROJECT_VERSION: '202610211503'
  DEVELOPMENT_TEAM: QMM486NPYC
  CODE_SIGN_STYLE: Automatic
targets:
  Healstack:
    type: application
    platform: iOS
    sources:
      # Icon Composer document, Liquid Glass layers. AppIcon.appiconset stays as the flat fallback.
      - path: Healstack.icon
        type: file
        buildPhase: resources
      - path: .
        excludes:
          - '*.md'
          - 'ExportOptions*.plist'
          - 'icon.svg'
          - 'Healstack.icon'
          - 'fastlane'
          - '*.xcodeproj'
          - '*.yml'
          - .git
          - .gitignore
          - README.md
          - CLAUDE.md
          - architecture.svg
          - '*.entitlements'
          - Tests
          - UITests
          - Checks
          - DoseWidget
          - watchos
          - macOS
          - scripts
          - .asc
          - fastlane
    dependencies:
      - sdk: HealthKit.framework
      - target: DoseWidgetExtension
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLint
    entitlements:
      path: Healstack.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.heyitsmejosh.dose
        com.apple.developer.applesignin:
          - Default
    settings:
      # iPhone only: was Universal but iPad UI was never actually designed for iPad Pro
      # (blocked App Store submission needing iPad Pro 12.9" screenshots, 2026-09-12).
      TARGETED_DEVICE_FAMILY: "1"
      INFOPLIST_FILE: Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.dose
      INFOPLIST_KEY_CFBundleDisplayName: Machaon
      CODE_SIGN_ENTITLEMENTS: Healstack.entitlements

  Healstack-macOS:
    type: application
    platform: macOS
    sources:
      # Icon Composer document, Liquid Glass layers. AppIcon.appiconset stays as the flat fallback.
      - path: Healstack.icon
        type: file
        buildPhase: resources
      - path: .
        excludes:
          - '*.md'
          - 'ExportOptions*.plist'
          - 'icon.svg'
          - 'Healstack.icon'
          - 'fastlane'
          - '*.xcodeproj'
          - '*.yml'
          - .git
          - .gitignore
          - README.md
          - CLAUDE.md
          - architecture.svg
          - '*.entitlements'
          - '*.plist'
          - Tests
          - UITests
          - Checks
          - DoseWidget
          - watchos
          - macOS
          - scripts
          - .asc
          - fastlane
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLint
    settings:
      INFOPLIST_FILE: macOS/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.dose
      PRODUCT_NAME: Healstack
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      ENABLE_HARDENED_RUNTIME: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_ENTITLEMENTS: macOS/Healstack-macOS.entitlements

  HealstackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Healstack
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.dose.tests
      GENERATE_INFOPLIST_FILE: YES

  HealstackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Healstack
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.dose.uitests
      GENERATE_INFOPLIST_FILE: YES

  DoseWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DoseWidget
    entitlements:
      path: DoseWidget/DoseWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.heyitsmejosh.dose
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.dose.widget
      INFOPLIST_FILE: DoseWidget/Info.plist
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  Healstack-macOS:
    build:
      targets:
        Healstack-macOS: all
    run:
      config: Debug
  Healstack:
    build:
      targets:
        Healstack: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HealstackTests
  HealstackUITests:
    build:
      targets:
        Healstack: all
        HealstackUITests: all
    test:
      config: Debug
      targets:
        - HealstackUITests
